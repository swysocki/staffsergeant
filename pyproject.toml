[project]
name = "staffsergeant"
dynamic = ["version"]
requires-python = ">=3.12"

dependencies = [
    "Jinja2",
    "markdown",
    "typer",
]

[project.optional-dependencies]
dev = ["ruff", "pytest"]

[project.scripts]
ssg = "ssg:main"

[build-system]
requires = ["setuptools>=80", "setuptools_scm[simple]>=8.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
exclude = ["build"]


[tool.ruff.lint]
select = ["E", "F"]
